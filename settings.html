<div id="clodex-rp-studio-settings" class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
        <b data-clodex-rp-i18n="plugin.name">CLODEx RP Studio</b>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
        <p class="clodex-rp-muted" data-clodex-rp-i18n="settings.info"></p>
        <div class="clodex-rp-btn-row clodex-rp-mt">
            <button type="button" class="menu_button" data-rp-open="tracker" data-clodex-rp-i18n="tab.tracker"></button>
            <button type="button" class="menu_button" data-rp-open="cradle" data-clodex-rp-i18n="tab.cradle"></button>
            <button type="button" class="menu_button" data-rp-open="codex" data-clodex-rp-i18n="tab.codex"></button>
            <button type="button" class="menu_button" data-rp-open="scene" data-clodex-rp-i18n="tab.scene"></button>
            <button type="button" class="menu_button" data-rp-open="forge" data-clodex-rp-i18n="tab.forge"></button>
            <button type="button" class="menu_button" data-rp-open="account" data-clodex-rp-i18n="tab.account"></button>
        </div>
    </div>
</div>
